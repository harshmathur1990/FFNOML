# Learning-curve experiments for scripts/submit_learning_curve.py (run on an Olivia login node):
#   python3 scripts/submit_learning_curve.py scripts/learning_curve.ini --dry-run     # check the data, write run dirs
#   python3 scripts/submit_learning_curve.py scripts/learning_curve.ini               # submit every experiment
#   python3 scripts/submit_learning_curve.py scripts/learning_curve.ini sims1 same3   # only these
#   python3 scripts/submit_learning_curve.py scripts/learning_curve.ini sims2 --resume  # continue a timed-out training
#
# [DEFAULT] holds the settings of every experiment; a section overrides any of them for itself.
# Snapshots are sim/snap, separated by spaces or newlines (indent continuation lines). They are read from packed_data,
# one HDF5 holding every snapshot of this file (atmosphere, mesh, H and CA populations, tau500), made on eagle7 with
#   python packed_data.py /mn/stornext/d9/data/harshm/ffnoml_runs/learning_curve_data.h5 --ini scripts/learning_curve.ini
# and copied to Olivia's input directory with its manifest (learning_curve_data.h5 and learning_curve_data.h5.json). Without packed_data
# they are read from data_dir/bifrost_data.
#
# Reading the result (python scripts/learning_curve_summary.py ROOT): if the unseen_sim error falls from sims1 to sims4,
# and sims3 beats same3 (the same three snapshots' worth of data from one simulation), diverse simulations are the lever;
# if it stays flat while train and val sit at the production floor, the model or the loss is.

[DEFAULT]
root = /cluster/work/projects/nn2834k/harshm/outputs/learning_curve
packed_data = /cluster/work/projects/nn2834k/harshm/input/learning_curve_data.h5
data_dir =                 # instead of packed_data: the directory holding bifrost_data/
atoms = H                  # H or CA, one per experiment
epochs = 400
nodes = 2                  # 4 GPUs each
time = 1-00:00:00          # training wall time; evaluation has 6 h (learning_curve_eval.sbatch)
train_flags =              # extra pipeline.py --train flags
# scored as same_sim when the experiment trains on the simulation, otherwise as unseen_sim
held_out = en024048_hion/465 en024048_hion/700 en024048_hion/385 ch024031_by200bz005/450

# one training snapshot from each of 1..4 simulations, nested
[sims1]
train = nw012023/915
val = nw012023/940

[sims2]
train = nw012023/915 ch012006/836
val = nw012023/940 ch012006/849

[sims3]
train = nw012023/915 ch012006/836 ch012012_hion/910
val = nw012023/940 ch012006/849 ch012012_hion/984

[sims4]
train = nw012023/915 ch012006/836 ch012012_hion/910 qs006003_sap/689
val = nw012023/940 ch012006/849 ch012012_hion/984 qs006003_sap/900

# three snapshots of one simulation: the volume of sims3 without its variety
[same3]
train = nw012023/915 nw012023/1050 nw012023/1120
val = nw012023/940

# the production splits from scratch, for reference: should reproduce the production checkpoint's errors
[all5]
train = en024048_hion/465 nw012023/915 ch012012_hion/910 ch012006/836 qs006003_sap/689
val = en024048_hion/700 nw012023/940 ch012012_hion/984 ch012006/849 qs006003_sap/900

