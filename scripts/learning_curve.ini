# Learning-curve experiments. Olivia runs GPU work only (training and --fsdppredict); everything else is on eagle7.
#   eagle7:  python scripts/learning_curve_eagle7.py prepare scripts/learning_curve.ini      # datasets, solving sets
#   Mac:     python3 scripts/learning_curve_eagle7.py upload scripts/learning_curve.ini      # scp to Olivia (needs the
#            ssh socket: ssh -o ControlMaster=yes -o ControlPath=~/.ssh/olivia.sock -o ControlPersist=8h -fN harshm@olivia.sigma2.no)
#   Olivia:  python3 scripts/submit_learning_curve.py scripts/learning_curve.ini --dry-run   # check the inputs
#            python3 scripts/submit_learning_curve.py scripts/learning_curve.ini             # one job per experiment
#            python3 scripts/submit_learning_curve.py scripts/learning_curve.ini final66_fno_l004_zaug --resume   # after a time limit
#   Mac:     python3 scripts/learning_curve_eagle7.py fetch scripts/learning_curve.ini       # checkpoints, predictions
#   eagle7:  python scripts/learning_curve_eagle7.py score scripts/learning_curve.ini
#            python scripts/learning_curve_summary.py /mn/stornext/d9/data/harshm/ffnoml_runs/learning_curve
# Any command takes section names to act on only those.
# Every experiment trains the final model (config.py's MODEL_CONFIG, the level-fraction head). lam_total (default 0.3)
# weighs the species-total loss; lam_ratio and lam_ion (default 0) weigh the log10 ratio of every line's upper to
# lower level and of adjacent ionisation stages (FFNOML_LAM_RATIO, FFNOML_LAM_ION);
# model_config, JSON, overrides config.MODEL_CONFIG's sizes (e.g. {"width": 64}); the architecture is fixed.
# patience (default 50) is the early-stopping patience in epochs (FFNOML_PATIENCE);
# augment_z = yes adds to every training and validation patch a copy cut to a random window of its levels and one cut to
# a random uneven selection of them, each of at least augment_z_min_depth (default 16) levels, new cuts every epoch;
# resume_lr (default 5e-5) is the learning rate a --bestpath restart starts its cosine schedule from (FFNOML_RESUME_LR);
# trainselect < 1 trains each epoch on that fraction of the training patches, drawn again every epoch (FFNOML_TRAINSELECT);
# predict = no leaves out the job's --fsdppredict step (predicted on eagle7 after the fetch, or later on Olivia with
# submit_learning_curve.py EXPERIMENT --predict-only SIM/SNAP ..., after upload ... --snapshots SIM/SNAP ...).
#
# [DEFAULT] holds the settings of every experiment; a section overrides any of them for itself.
# Snapshots are sim/snap, separated by spaces or newlines (indent continuation lines).
#
[DEFAULT]
root = /cluster/work/projects/nn2834k/harshm/outputs/learning_curve      # Olivia: runs, datasets, solving sets
stage = /mn/stornext/d9/data/harshm/ffnoml_data/stage                    # eagle7: the same layout, built and scored here (past runs: ffnoml_data/models/*/olivia_runs)
data_dir = /mn/stornext/d9/data/harshm/                                  # eagle7: holds bifrost_data/
# solving sets already built on eagle7 (raw inputs, any checkpoint), linked instead of rebuilt
solving_sets_from = /mn/stornext/d9/data/harshm/ffnoml_data/reference/solving_sets
atoms = H                  # H or CA, one per experiment
epochs = 400
nodes = 8                  # 4 GPUs each; the production model needs 8 to fit in memory (train_gpu.sh)
time = 1-00:00:00          # training and then the predictions
train_flags =              # extra pipeline.py --train flags
# scored as same_sim when the experiment trains on the simulation, otherwise as unseen_sim
held_out = en024048_hion/465 en024048_hion/700 en024048_hion/385 ch024031_by200bz005/450

# The H 6 + 6 final: FFNO3D as a neural operator in x, y and z (the height operator), band-limited at 2 x 20 km, the finest
# Bifrost spacing, with frequency MLPs on a physical wavenumber scale (0.3 Mm) and each column cut off at its own grid
# Nyquist (eagle7 screen e7_55_fno_l004p), on the 6 + 6 split with cbh24; every training patch every epoch, 400
# epochs, continued with --resume when the 24 h limit stops it. Datasets: eagle7_screen/e7_66_base.
[final66_fno_l004]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689 cbh24/s0910
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900 cbh24/s0928
lam_total = 0.3
epochs = 400
nodes = 8
predict = no

# The Ca II counterpart of final66_fno_l004: the same model, head, loss, split and 40 x 40 patches, atoms = CA.
# Job 3069359 stopped early at epoch 148 (best 98) with the learning rate still high; continued with --resume and
# patience 400, so the cosine schedule runs to its end.
[final66_fno_l004_ca]
atoms = CA
patience = 400
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689 cbh24/s0910
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900 cbh24/s0928
lam_total = 0.3
epochs = 400
nodes = 8
predict = no

# final66_fno_l004 continued on its own data plus, for every patch, a random window and a random uneven selection of its
# levels (at least 16), drawn again every epoch, so that it sees columns without a corona or a deep photosphere and on
# other vertical grids (FALC). Started with --bestpath from
# the final66_fno_l004 checkpoint (job 3038116, epoch 306): a validation baseline on the new validation set first, then
# 400 epochs to improve on it, cosine from 1e-3 (resume_lr) as in a fresh run. Its IO links to final66_fno_l004/IO.
[final66_fno_l004_zaug]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689 cbh24/s0910
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900 cbh24/s0928
lam_total = 0.3
epochs = 400
nodes = 8
predict = no
patience = 400
train_flags = --resume --bestpath
augment_z = yes
augment_z_min_depth = 16
resume_lr = 1e-3

# The Ca II counterpart of final66_fno_l004_zaug: final66_fno_l004_ca (job 3075025, best epoch 187) continued with
# --bestpath on its own data plus a random window and a random uneven selection of every patch's levels, cosine from
# 1e-3. Its IO links to final66_fno_l004_ca/IO.
[final66_fno_l004_ca_zaug]
atoms = CA
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689 cbh24/s0910
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900 cbh24/s0928
lam_total = 0.3
epochs = 400
nodes = 8
predict = no
patience = 400
train_flags = --resume --bestpath
augment_z = yes
augment_z_min_depth = 16
resume_lr = 1e-3

# final66_fno_l004_zaug continued with two more loss terms, both 0.3 like lam_total: lam_ratio, |log10 n_u/n_l pred - true|
# over every line of the atom (the line source functions; nw072100's H-alpha excess is n3/n2), and lam_ion,
# |log10 N_k/N_k+1 pred - true| over adjacent ionisation stages (Ca II/Ca III is 0.14 dex off on validation). Started with
# --bestpath from the zaug checkpoint (job 3087598, epoch 174): a validation baseline with the new loss first, then 400
# epochs, cosine from 1e-4, height augmentation as in zaug. (A first try from 1e-3, jobs 3119948/3119949, threw H off the
# zaug minimum: validation above the baseline for 22 epochs; zaug's last best came at an LR of about 6e-4.) Its IO links to final66_fno_l004/IO.
[final66_fno_l004_zaug_ratio]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689 cbh24/s0910
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900 cbh24/s0928
lam_total = 0.3
lam_ratio = 0.3
lam_ion = 0.3
epochs = 400
nodes = 8
predict = no
patience = 400
train_flags = --resume --bestpath
augment_z = yes
augment_z_min_depth = 16
resume_lr = 1e-4

# The Ca II counterpart: final66_fno_l004_ca_zaug (job 3087628, epoch 240) continued in the same way. Its IO links to
# final66_fno_l004_ca/IO.
[final66_fno_l004_ca_zaug_ratio]
atoms = CA
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689 cbh24/s0910
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900 cbh24/s0928
lam_total = 0.3
lam_ratio = 0.3
lam_ion = 0.3
epochs = 400
nodes = 8
predict = no
patience = 400
train_flags = --resume --bestpath
augment_z = yes
augment_z_min_depth = 16
resume_lr = 1e-4

