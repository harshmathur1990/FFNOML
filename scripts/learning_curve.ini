# Learning-curve experiments. Olivia runs GPU work only (training and --fsdppredict); everything else is on eagle7.
#   eagle7:  python scripts/learning_curve_eagle7.py prepare scripts/learning_curve.ini      # datasets, solving sets
#   Mac:     python3 scripts/learning_curve_eagle7.py upload scripts/learning_curve.ini      # scp to Olivia (needs the
#            ssh socket: ssh -o ControlMaster=yes -o ControlPath=~/.ssh/olivia.sock -o ControlPersist=8h -fN harshm@olivia.sigma2.no)
#   Olivia:  python3 scripts/submit_learning_curve.py scripts/learning_curve.ini --dry-run   # check the inputs
#            python3 scripts/submit_learning_curve.py scripts/learning_curve.ini             # one job per experiment
#            python3 scripts/submit_learning_curve.py scripts/learning_curve.ini sims4 --resume   # after a time limit
#   Mac:     python3 scripts/learning_curve_eagle7.py fetch scripts/learning_curve.ini       # checkpoints, predictions
#   eagle7:  python scripts/learning_curve_eagle7.py score scripts/learning_curve.ini
#            python scripts/learning_curve_summary.py /mn/stornext/d9/data/harshm/ffnoml_runs/learning_curve
# Any command takes section names to act on only those.
#
# [DEFAULT] holds the settings of every experiment; a section overrides any of them for itself.
# Snapshots are sim/snap, separated by spaces or newlines (indent continuation lines).
#
# Reading the result: if the unseen_sim error falls from sims1 to sims4, and sims4 beats same3 (three snapshots of one
# simulation), diverse simulations are the lever; if it stays flat while train and val sit at the production floor,
# the model or the loss is.

[DEFAULT]
root = /cluster/work/projects/nn2834k/harshm/outputs/learning_curve      # Olivia: runs, datasets, solving sets
stage = /mn/stornext/d9/data/harshm/ffnoml_runs/learning_curve           # eagle7: the same layout, built and scored here
data_dir = /mn/stornext/d9/data/harshm/                                  # eagle7: holds bifrost_data/
# solving sets already built on eagle7 (raw inputs, any checkpoint), linked instead of rebuilt
solving_sets_from = /mn/stornext/d9/data/harshm/ffnoml_runs/population_errors/training_FFNO3D_zscale_expand_lognlte
atoms = H                  # H or CA, one per experiment
epochs = 400
nodes = 8                  # 4 GPUs each; the production model needs 8 to fit in memory (train_gpu.sh)
time = 1-00:00:00          # training and then the predictions
train_flags =              # extra pipeline.py --train flags
# scored as same_sim when the experiment trains on the simulation, otherwise as unseen_sim
held_out = en024048_hion/465 en024048_hion/700 en024048_hion/385 ch024031_by200bz005/450

# one training snapshot from each of 1..4 simulations, nested (sims2 and sims3 commented out: uncomment to run)
[sims1]
train = nw012023/915
val = nw012023/940

# [sims2]
# train = nw012023/915 ch012006/836
# val = nw012023/940 ch012006/849

# [sims3]
# train = nw012023/915 ch012006/836 ch012012_hion/910
# val = nw012023/940 ch012006/849 ch012012_hion/984

[sims4]
train = nw012023/915 ch012006/836 ch012012_hion/910 qs006003_sap/689
val = nw012023/940 ch012006/849 ch012012_hion/984 qs006003_sap/900

# three snapshots of one simulation: the volume of sims3 without its variety
[same3]
train = nw012023/915 nw012023/1050 nw012023/1120
val = nw012023/940

# the production splits from scratch, for reference (commented out: uncomment to run)
# [all5]
# train = en024048_hion/465 nw012023/915 ch012012_hion/910 ch012006/836 qs006003_sap/689
# val = en024048_hion/700 nw012023/940 ch012012_hion/984 ch012006/849 qs006003_sap/900

