# Paths are resolved relative to this configuration file.
[input]
folder = "/mn/stornext/d9/data/harshm/bifrost_data/ar098192/atmos"
simulation_code = "MURaM"
simulation_name = "ar098192"
snap = 270000

# Crop/subsample the source FITS axes before rotation into FFNO coordinates.
# Each axis may instead use compact syntax, for example: x = "0:504:2".
[selection]
height_min_m = -1300000.0
height_max_m = 8000000.0

# [selection.x]
# start = 0
# stop = 504
# step = 1

# [selection.y]
# start = 0
# stop = 504
# step = 1

# [selection.z]
# step = 1

# Omit dx_m/dy_m to infer them from FITS CDELT1/CDELT2 and CUNIT1/CUNIT2.
# [grid]
# dx_m = 16000.0
# dy_m = 16000.0

[eos]
backend = "auto"                 # auto, cpp, or python
# witt_path = "/path/to/witt"
# workers = 8
chunk_size = 4096
pool_chunksize = 1
show_progress = true

[output]
hdf5 = "../training_FFNO3D_zscale_expand_lognlte/3D_sim_predict_ar098192_270000.hdf5"
multi3d_atmos = "/mn/stornext/d9/data/harshm/bifrost_data/ar098192/270000/atm3d"
multi3d_mesh = "/mn/stornext/d9/data/harshm/bifrost_data/ar098192/270000/mesh"
# compression = 4
overwrite = false

[resampling]
# Number of native C++ interpolation threads. Omit to use all CPUs available to
# the process (including the CPU affinity assigned by Slurm).
# workers = 32

# By default, temperature, rho, ne, pgas, and hydrogen_populations are
# interpolated in log10 space. Override individual channels here; false selects
# ordinary value-space interpolation. Log-space interpolation requires every
# source value in that channel to be positive.
[resampling.log_space]
pgas = true
rho = true
ne = true
hydrogen_populations = true
temperature = true

# Preferred: give the requested physical grid spacing directly in metres. The
# written dx and dy equal these x/y values, and the new height grid has the
# requested absolute z increment. If the domain is not exactly divisible by a
# spacing, the final remainder shorter than one grid cell is omitted.
[resampling.target_spacing_m]
x = 24000.0
y = 24000.0
z = 16000.0

# Alternatively, use factors OR target_shape for a given axis. A factor of 2
# changes n points into 2*(n-1)+1 points and preserves both domain endpoints.
# [resampling.factors]
# x = 2.0
# y = 2.0
# z = 2.0
#
# [resampling.target_shape]
# x = 1008
# y = 1008
# z = 512

# Methods are nearest, linear, or cubic. Cubic uses Boost.Math's
# shape-preserving PCHIP interpolation. Axis names here refer to the final FFNO
# coordinates, after the horizontal rotation.
[resampling.default]
x = "cubic"
y = "cubic"
z = "cubic"

# Per-channel values override only the listed default directions. Available
# channels: temperature, rho, pgas, vx, vy, vz, ne, and hydrogen_populations.
# Interpolated pgas/rho and the floored interpolated temperature are used when
# electron density must be derived with the Witt EOS.
# [resampling.channels.temperature]
# x = "cubic"
# y = "cubic"
# z = "cubic"

# [resampling.channels.rho]
# x = "cubic"
# y = "cubic"
# z = "cubic"

# [resampling.channels.ne]
# x = "cubic"
# y = "cubic"
# z = "cubic"

# [resampling.channels.vz]
# x = "cubic"
# y = "cubic"
# z = "cubic"

[validation]
temperature_floor_k = 3250.0
positive_channels = ["temperature", "rho", "ne", "pgas"]

# Maximum permitted relative increase in the steepest absolute log10 gradient
# (dex/m) from the original grid to the densely resampled grid. For example,
# 0.25 allows the resampled maximum gradient to be up to 25% larger. Omit this
# hierarchy to disable continuity comparison. A channel must exist on the
# original grid, so use pgas (not ne) when ne is derived from pgas by the EOS.
[validation.continuity_max_relative_increase.rho]
x = 0.25
y = 0.25
z = 0.25

[validation.continuity_max_relative_increase.pgas]
x = 0.25
y = 0.25
z = 0.25
