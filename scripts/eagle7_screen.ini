# Capacity test on eagle7's T4s (docs/level-fractions-capacity-plan.md, "Phase 4 on eagle7"), in place of screening
# each change on Olivia: sims1's datasets, a random 16 x 16 window of each 40 x 40 patch per epoch (FFNOML_CROP=16),
# 40 epochs, one T4 per experiment. Trained with pipeline.py --train under that environment; then predicted and scored
# with learning_curve_eagle7.py predict --batched and score, as the Olivia runs are.

[DEFAULT]
root = /cluster/work/projects/nn2834k/harshm/outputs/learning_curve      # unused: these runs stay on eagle7
stage = /mn/stornext/d9/data/harshm/ffnoml_runs/eagle7_screen
data_dir = /mn/stornext/d9/data/harshm/
solving_sets_from = /mn/stornext/d9/data/harshm/ffnoml_runs/population_errors/training_FFNO3D_zscale_expand_lognlte
atoms = H
epochs = 40
nodes = 1                  # unused (Olivia)
time = 1-00:00:00          # unused (Olivia)
train_flags =
held_out = en024048_hion/465 en024048_hion/700 en024048_hion/385 ch024031_by200bz005/450
train = nw012023/915
val = nw012023/940
output_mode = level_fraction
lam_total = 0.3

# the level-fraction head with departure coefficients, today's size
[e7_base]

# + z-spectral branch, low-rank frequency mixing, open side paths, width 96 (capacity steps 1-4)
[e7_s14]
model_config = {"z_spectral_modes": 64, "freq_mix_rank": 8, "open_side_paths": true, "width": 96}

# e7_s14 with 6 blocks (step 5)
[e7_s14_6blk]
model_config = {"z_spectral_modes": 64, "freq_mix_rank": 8, "open_side_paths": true, "width": 96, "n_layers": 6, "spec_dropout_layers": [0, 1, 2, 3, 4, 5], "vertical_dropout_layers": [0, 1, 2, 3, 4, 5]}

# The same three on the 5 + 5 production split, 30 epochs, each epoch on a fifth of the training patches drawn again
# every epoch (FFNOML_TRAINSELECT=0.2): sims1's cost per epoch, five simulations' diversity.
[e7_55_base]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900
epochs = 30

[e7_55_s14]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900
epochs = 30
model_config = {"z_spectral_modes": 64, "freq_mix_rank": 8, "open_side_paths": true, "width": 96}

[e7_55_s14_6blk]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900
epochs = 30
model_config = {"z_spectral_modes": 64, "freq_mix_rank": 8, "open_side_paths": true, "width": 96, "n_layers": 6, "spec_dropout_layers": [0, 1, 2, 3, 4, 5], "vertical_dropout_layers": [0, 1, 2, 3, 4, 5]}
