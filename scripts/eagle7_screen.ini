# Capacity test on eagle7's T4s (docs/level-fractions-capacity-plan.md, "Phase 4 on eagle7"), in place of screening
# each change on Olivia: sims1's datasets, a random 16 x 16 window of each 40 x 40 patch per epoch (FFNOML_CROP=16),
# 40 epochs, one T4 per experiment. Trained with pipeline.py --train under that environment; then predicted and scored
# with learning_curve_eagle7.py predict --batched and score, as the Olivia runs are.

[DEFAULT]
root = /cluster/work/projects/nn2834k/harshm/outputs/learning_curve      # unused: these runs stay on eagle7
stage = /mn/stornext/d9/data/harshm/ffnoml_runs/eagle7_screen
data_dir = /mn/stornext/d9/data/harshm/
solving_sets_from = /mn/stornext/d9/data/harshm/ffnoml_runs/population_errors/training_FFNO3D_zscale_expand_lognlte
atoms = H
epochs = 40
nodes = 1                  # unused (Olivia)
time = 1-00:00:00          # unused (Olivia)
train_flags =
held_out = en024048_hion/465 en024048_hion/700 en024048_hion/385 ch024031_by200bz005/450
train = nw012023/915
val = nw012023/940
output_mode = level_fraction
lam_total = 0.3

# the level-fraction head with departure coefficients, today's size
[e7_base]

# + z-spectral branch, low-rank frequency mixing, open side paths, width 96 (capacity steps 1-4)
[e7_s14]
model_config = {"z_spectral_modes": 64, "freq_mix_rank": 8, "open_side_paths": true, "width": 96}

# e7_s14 with 6 blocks (step 5)
[e7_s14_6blk]
model_config = {"z_spectral_modes": 64, "freq_mix_rank": 8, "open_side_paths": true, "width": 96, "n_layers": 6, "spec_dropout_layers": [0, 1, 2, 3, 4, 5], "vertical_dropout_layers": [0, 1, 2, 3, 4, 5]}

# The same three on the 5 + 5 production split, 30 epochs, each epoch on a fifth of the training patches drawn again
# every epoch (FFNOML_TRAINSELECT=0.2): sims1's cost per epoch, five simulations' diversity.
[e7_55_base]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900
epochs = 30

[e7_55_s14]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900
epochs = 30
model_config = {"z_spectral_modes": 64, "freq_mix_rank": 8, "open_side_paths": true, "width": 96}

[e7_55_s14_6blk]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900
epochs = 30
model_config = {"z_spectral_modes": 64, "freq_mix_rank": 8, "open_side_paths": true, "width": 96, "n_layers": 6, "spec_dropout_layers": [0, 1, 2, 3, 4, 5], "vertical_dropout_layers": [0, 1, 2, 3, 4, 5]}

# 6 + 6 (the final model's split, with cbh24): datasets built on hyades (learning_curve_eagle7.py prepare)
[e7_66_base]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689 cbh24/s0910
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900 cbh24/s0928
epochs = 30

# A neural operator in x, y and z (vertical_operator): the vertical stack replaced by HeightSpectralConv (spectral in
# height on each column's own heights, wavenumbers 2 pi m / 40 Mm down to 0.3 Mm wavelength, exact for piecewise-linear
# columns), no 3x3x3 convolution in the fusion, every GroupNorm weighted by height; width, rank, side paths as e7_55_s14
[e7_55_fno]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900
epochs = 30
model_config = {"vertical_operator": true, "z_reference_length": 40.0, "z_min_wavelength": 0.3, "freq_mix_rank": 8, "open_side_paths": true, "width": 96}

# e7_55_fno with more capacity, one axis each: wider with a higher frequency-mixing rank, or deeper
[e7_55_fno_w128]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900
epochs = 30
model_config = {"vertical_operator": true, "z_reference_length": 40.0, "z_min_wavelength": 0.3, "freq_mix_rank": 16, "open_side_paths": true, "width": 128}

[e7_55_fno_6blk]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900
epochs = 30
model_config = {"vertical_operator": true, "z_reference_length": 40.0, "z_min_wavelength": 0.3, "freq_mix_rank": 8, "open_side_paths": true, "width": 96, "n_layers": 6, "spec_dropout_layers": [0, 1, 2, 3, 4, 5], "vertical_dropout_layers": [0, 1, 2, 3, 4, 5]}

# e7_55_s14 with the z-spectral branch along height (SpectralConvHeight: fixed wavenumbers 2 pi m / 40 Mm on each
# column's own heights, the same on any vertical grid) instead of along the level index
[e7_55_s14h]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900
epochs = 30
model_config = {"z_spectral_modes": 64, "z_reference_length": 40.0, "freq_mix_rank": 8, "open_side_paths": true, "width": 96}

# e7_55_s14 without the z-spectral branch (steps 2-4): what the branch adds
[e7_55_s14noz]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900
epochs = 30
model_config = {"freq_mix_rank": 8, "open_side_paths": true, "width": 96}

# e7_55_fno trained 150 epochs (30 of e7_55_s14 cost about 150 of fno: 1.1 s/it against 5.5), and with the
# band limit halved to 0.15 Mm (268 modes) for the sharp transition-region gradients
[e7_55_fno_e150]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900
epochs = 150
model_config = {"vertical_operator": true, "z_reference_length": 40.0, "z_min_wavelength": 0.3, "freq_mix_rank": 8, "open_side_paths": true, "width": 96}

[e7_55_fno_l015]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900
epochs = 30
model_config = {"vertical_operator": true, "z_reference_length": 40.0, "z_min_wavelength": 0.15, "freq_mix_rank": 8, "open_side_paths": true, "width": 96}

# both gains together: the 0.15 Mm band limit trained 150 epochs
[e7_55_fno_l015_e150]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900
epochs = 150
model_config = {"vertical_operator": true, "z_reference_length": 40.0, "z_min_wavelength": 0.15, "freq_mix_rank": 8, "open_side_paths": true, "width": 96}

# the band limit at the finest Bifrost spacing: 2 x 20 km = 0.04 Mm (1001 modes), 30 epochs as e7_55_fno_l015
[e7_55_fno_l004]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900
epochs = 30
model_config = {"vertical_operator": true, "z_reference_length": 40.0, "z_min_wavelength": 0.04, "freq_mix_rank": 8, "open_side_paths": true, "width": 96}

# e7_55_fno_l004 with the frequency MLPs on a fixed physical wavenumber scale (z_feature_wavelength 0.3 Mm) and each
# column's wavenumbers limited by its own median spacing (z_column_cutoff)
[e7_55_fno_l004p]
train = ch012006/836 ch012012_hion/910 en024048_hion/465 nw012023/915 qs006003_sap/689
val = ch012006/849 ch012012_hion/984 en024048_hion/700 nw012023/940 qs006003_sap/900
epochs = 30
model_config = {"vertical_operator": true, "z_reference_length": 40.0, "z_min_wavelength": 0.04, "z_feature_wavelength": 0.3, "z_column_cutoff": true, "freq_mix_rank": 8, "open_side_paths": true, "width": 96}
