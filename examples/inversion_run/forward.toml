mode = "forward"

[inputs]
initial_atmosphere_file = "inputs/initial_atmosphere.h5"
time_index = 1

[outputs]
# per-frequency unit of the written spectra and of an observation file: "si" (J s^-1 m^-2 Hz^-1 sr^-1) or "cgs"
# (erg s^-1 cm^-2 Hz^-1 sr^-1); each region's normalization then divides them (below: cgs disk-centre continua)
intensity_units = "cgs"
synthesis_file = "outputs/synthesis.h5"
atmosphere_file = "outputs/forward_atmosphere.h5"

[atmosphere]
# native vertical coordinate of the input: "log10tau500" (this file) or "z" (see forward_z.toml)
vertical_coordinate = "log10tau500"
storage_order = "python"

# What a positive vz means in the input: "up" (default, as the FFNO's Bifrost training data) or "down" (vz negated on
# input and output, vz control bounds mirrored). z is always positive upward; nothing else changes.
# vz_positive = "up"

[atmosphere.datasets]
logtau500 = "logtau_500"
temperature = "temperature"
# vturb = "vturb" # optional; defaults to zero if not configured
vx = "vx"
vy = "vy"
vz = "vz"
# Bx = "Bx"
# By = "By"
# Bz = "Bz"


# Viewing angle (docs/viewing-angle/README.md). Without this section, or with mu = 1, the view is vertical.
# A native log-tau input at mu < 1 must already hold one line of sight per pixel: T and v on log10 tau500 counted
# along the ray, on a regular deprojected footprint grid (dx, dy: footprint spacings), tagged with the HDF5
# attributes view_mu, view_azimuth_deg and view_geometry equal to this section. "inclined" places every ray's points
# at their 3-D positions for the FFNO (x = xi + tan(theta) cos(azimuth) z, ...); "plane_parallel" treats the columns
# as vertical (the 1.5-D shortcut). Spatial PSF FWHMs are in sky metres and are stretched by 1/mu along the tilt.
# [view]
# mu = 0.8                     # cos(theta), 0 < mu <= 1
# azimuth_deg = 0.0            # direction of the tilt, from +x toward +y; 0, 90, 180 or 270 with a spatial PSF
# geometry = "inclined"        # or "plane_parallel"

[equilibrium]
# HSEMHS reconstructs Pgas, rho, ne and the derived coordinate (height here) in process. The mode follows from
# atmosphere.vertical_coordinate and model:
#   log10tau500 + column_hse -> column-hse-ltau   (this file)
#   log10tau500 + mhs        -> mhs-poisson-ltau  (available from HSEMHS integration Phase 4; needs Bx, By, Bz)
#   z           + column_hse -> column-hse-z      (see forward_z.toml / inversion_z.toml)
#   z           + mhs        -> mhs-poisson-z     (Phase 4)
backend = "HSEMHS"           # the only equilibrium backend
model = "column_hse"
# model = "mhs"              # Phase 4
gravity_m_s2 = 274.0
eos_table_file = "inputs/eos_table_fullz.h5"   # HSEMHS EOS table (copy or link HSEMHS/cache/eos_table_fullz.h5)
on_nonconvergence = "reject_trial"             # or "abort"

# Native log tau: no pressure anchor; HSEMHS's tau-hydrostatic top closure sets the pressure.
[equilibrium.column_ltau]
align = "ptot"               # "ptot": P + B^2/2mu0 equal at one height (B = 0 if no field is given); "none"
[grid]
dx_m = 48000.0
dy_m = 48000.0

[[regions]]
start_angstrom = 6561.92
step_angstrom = 0.020
count = 88
normalization = 4.323060e-05
psf_type = "none"

[[regions.sources]]
mode = "ffno"
species = "H"
line = "halpha"

[[regions]]
start_angstrom = 8540.23102
step_angstrom = 0.04267
count = 88
normalization = 4.227725e-05
psf_type = "none"

[[regions.sources]]
mode = "ffno"
species = "CA"
line = "ca_ii_8542"

[[regions]]
start_angstrom = 6301.24942
step_angstrom = 0.01007
count = 46
normalization = 4.054384e-05
psf_type = "none"

[[regions.sources]]
mode = "kurucz_lte"
linelist_file = "inputs/kurucz_6302.list"

# FFNO was trained on simulation height grids, not on log tau: for a native log-tau atmosphere its populations are
# predicted on this height mesh (each column interpolated onto it using the HSEMHS heights, extended below its
# bottom in hydrostatic equilibrium with d ln T/d ln P = nabla) and interpolated back. On by default for log tau;
# the values below are the defaults. Not used for a native z grid.
[population.mesh]
# enabled = true
bottom_m = -1.0e6            # mesh bottom [m] (training grids: -1 to -2.5 Mm)
top_m = 1.4e7                # mesh top [m]
spacing_m = 2.0e4            # spacing up to uniform_top_m [m] (training grids: 12-30 km)
uniform_top_m = 4.5e6
stretch = 1.01               # spacing growth per point above uniform_top_m
max_spacing_m = 1.0e5
nabla = 0.13                 # d ln T / d ln P of the deep extension (near-adiabatic convection zone)

[physics]
redistribution = "non_prd"

[observation]
stokes = ["I"]

[observation.gaussian_psf]
spatial_fwhm_x_m = 96000.0
spatial_fwhm_y_m = 96000.0

[parallel]
enabled = true
decomposition = "x_slabs"
gpu_launcher_rank = 0
gpu_connect_timeout_seconds = 180.0
gpu_status_timeout_seconds = 300.0
gpu_diagnostic_interval_seconds = 30.0
gpu_diagnostics_directory = ""
