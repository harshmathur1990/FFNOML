mode = "forward"

[inputs]
initial_atmosphere_file = "inputs/initial_atmosphere.h5"
time_index = 1

[outputs]
# wavelength_frame = "air"    # frame of the written wavelength_m, "air" or "vacuum"; a label only, synthesis is on the vacuum grid
# per-frequency unit of the written spectra and of an observation file: "si" (J s^-1 m^-2 Hz^-1 sr^-1) or "cgs"
# (erg s^-1 cm^-2 Hz^-1 sr^-1); each region's normalization then divides them (below: cgs disk-centre continua)
intensity_units = "cgs"
synthesis_file = "outputs/synthesis.h5"
atmosphere_file = "outputs/forward_atmosphere.h5"

[atmosphere]
# native vertical coordinate of the input: "log10m" (this file), "log10tau500" (see forward.toml) or "z" (see forward_z.toml)
vertical_coordinate = "log10m"
storage_order = "python"

# What a positive vz means in the input: "up" (default, as the FFNO's Bifrost training data) or "down" (vz negated on
# input and output, vz control bounds mirrored). z is always positive upward; nothing else changes.
# vz_positive = "up"

[atmosphere.datasets]
# log10 of the column mass; kg m^-2 unless the dataset's `units` attribute says "g cm-2".
# ../../scripts/build_input_logm.py builds such a file from a Bifrost snapshot.
log10m = "log10m"
# How pressure, density, electron density and the geometry are obtained (forward only, except the first):
#
#   Mode      Add to this section        P, rho                         Neutral H, protons       HSEMHS
#   hse       nothing                    P = g m; rho from the EOS      EOS at (T, P)            yes
#   ne-eos    ne                         EOS at (T, ne)                 EOS at (T, P)            yes
#   ne-rho    ne, rho                    rho given; P from n_H, ne      EOS at (T, P)            no
#   ne-hpops  ne, hydrogen_populations   both from n_H, ne              given                    no
#
# ne [m^-3]; rho [kg m^-3]; hydrogen_populations [m^-3], file axes (level,z,y,x), the last level the protons. rho and
# hydrogen_populations cannot be combined. ne-eos makes P and rho LTE values, which can be far from the model's where
# its ne is not LTE. ne-rho passes a simulation's own T, v, ne and rho to the FFNO unchanged.
# For ne-rho and ne-hpops, also remove [equilibrium.column_logm] below: it is refused there. The rest of [equilibrium] is then
# optional, but the population mesh, on by default here, still needs eos_table_file (or set
# [population.mesh] enabled = false). Details: FFNOInversion.jl/README.md.
# ne = "ne"
# rho = "rho"
# hydrogen_populations = "hydrogen_populations"
temperature = "temperature"
# vturb = "vturb" # optional; defaults to zero if not configured
vx = "vx"
vy = "vy"
vz = "vz"
# Bx = "Bx"
# By = "By"
# Bz = "Bz"


# Viewing angle (docs/viewing-angle/README.md). Without this section, or with mu = 1, the view is vertical.
# A native log-m input at mu < 1 must already hold one line of sight per pixel: T and v on log10 m counted
# along the ray, on a regular deprojected footprint grid (dx, dy: footprint spacings), tagged with the HDF5
# attributes view_mu, view_azimuth_deg and view_geometry equal to this section. "inclined" places every ray's points
# at their 3-D positions for the FFNO (x = xi + tan(theta) cos(azimuth) z, ...); "plane_parallel" treats the columns
# as vertical (the 1.5-D shortcut). Spatial PSF FWHMs are in sky metres and are stretched by 1/mu along the tilt.
# [view]
# mu = 0.8                     # cos(theta), 0 < mu <= 1
# azimuth_deg = 0.0            # direction of the tilt, from +x toward +y; 0, 90, 180 or 270 with a spatial PSF
# geometry = "inclined"        # or "plane_parallel"

[equilibrium]
# HSEMHS reconstructs Pgas, rho, ne and the derived coordinate (height here) in process. The mode follows from
# atmosphere.vertical_coordinate and model:
#   log10m      + column_hse -> column-hse-logm   (this file)
#   log10m      + mhs        -> mhs-poisson-logm  (Phase 4)
#   log10tau500 + column_hse -> column-hse-ltau   (see forward.toml / inversion.toml)
#   log10tau500 + mhs        -> mhs-poisson-ltau  (available from HSEMHS integration Phase 4; needs Bx, By, Bz)
#   z           + column_hse -> column-hse-z      (see forward_z.toml / inversion_z.toml)
#   z           + mhs        -> mhs-poisson-z     (Phase 4)
backend = "HSEMHS"           # the only equilibrium backend
model = "column_hse"
# model = "mhs"              # Phase 4
gravity_m_s2 = 274.0
eos_table_file = "inputs/eos_table_fullz.h5"   # HSEMHS EOS table (copy or link HSEMHS/cache/eos_table_fullz.h5)
on_nonconvergence = "reject_trial"             # or "abort"

# Native log m: no pressure anchor; P = g m (mu g m along the line of sight) needs no opacity.
[equilibrium.column_logm]
align = "ptot"               # "ptot": P + B^2/2mu0 equal at one height (B = 0 if no field is given); "none"
[grid]
dx_m = 48000.0
dy_m = 48000.0

[[regions]]
start_angstrom = 6561.92
step_angstrom = 0.020
count = 88
normalization = 4.323060e-05
psf_type = "none"

[[regions.sources]]
mode = "ffno"
species = "H"
line = "halpha"

[[regions]]
start_angstrom = 8540.23102
step_angstrom = 0.04267
count = 88
normalization = 4.227725e-05
psf_type = "none"

[[regions.sources]]
mode = "ffno"
species = "CA"
line = "ca_ii_8542"

[[regions]]
start_angstrom = 6301.24942
step_angstrom = 0.01007
count = 46
normalization = 4.054384e-05
psf_type = "none"

[[regions.sources]]
mode = "kurucz_lte"
linelist_file = "inputs/kurucz_6302.list"

# FFNO was trained on simulation height grids, not on log m: for a native log-m atmosphere its populations are
# predicted on this height mesh (each column interpolated onto it using the HSEMHS heights, extended below its
# bottom in hydrostatic equilibrium with d ln T/d ln P = nabla) and interpolated back. On by default for log m;
# the values below are the defaults. On a native z grid it is off unless enabled = true.
[population.mesh]
# enabled = true
bottom_m = -1.0e6            # mesh bottom [m] (training grids: -1 to -2.5 Mm)
top_m = 1.4e7                # mesh top [m]
spacing_m = 2.0e4            # spacing up to uniform_top_m [m] (training grids: 12-30 km)
uniform_top_m = 4.5e6
# corona_temperature_k = 1.0e6   # above a column's top: a corona in hydrostatic balance; 0 holds the top values
# corona_transition_m = 2.4e5
stretch = 1.01               # spacing growth per point above uniform_top_m
max_spacing_m = 1.0e5
nabla = 0.13                 # d ln T / d ln P of the deep extension (near-adiabatic convection zone)

[physics]
redistribution = "non_prd"
# line_center = "reference"   # FFNO lines at 656.28 and 854.209 nm (air); "atom": the atom file's level energies
# The continuum is Muspel's with hydrogen from the EOS; FFNO populations never enter it.

[observation]
stokes = ["I"]

[observation.gaussian_psf]
spatial_fwhm_x_m = 96000.0
spatial_fwhm_y_m = 96000.0

[parallel]
enabled = true
decomposition = "x_slabs"
gpu_launcher_rank = 0
gpu_connect_timeout_seconds = 180.0
gpu_status_timeout_seconds = 300.0
gpu_diagnostic_interval_seconds = 30.0
gpu_diagnostics_directory = ""
